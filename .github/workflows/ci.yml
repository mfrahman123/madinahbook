name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: node --check app.js && node --check server.js

      - name: Content validation
        run: npm run validate:content

      - name: Unit and content tests
        run: npm run test:unit && npm run test:content

      - name: Integration tests
        run: npm run test:integration
