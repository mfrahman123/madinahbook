<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#081521" />
    <title>Madinah Arabic Mobile</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
        background:
          linear-gradient(135deg, rgba(31, 199, 160, 0.14), transparent 34%),
          linear-gradient(215deg, rgba(216, 184, 104, 0.1), transparent 36%),
          #081521;
        color: #edf7f3;
      }

      main {
        width: min(420px, 100%);
        display: grid;
        gap: 18px;
        padding: 24px;
        border: 1px solid rgba(182, 245, 223, 0.15);
        border-radius: 14px;
        background: rgba(12, 28, 42, 0.88);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.34);
      }

      .mark {
        width: 58px;
        height: 58px;
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        font-size: 30px;
        line-height: 1;
      }

      p {
        color: #9cb2ad;
        line-height: 1.55;
      }

      a {
        min-height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        background: #1fc7a0;
        color: #031a16;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="./assets/madinah-icon.svg" alt="" />
      <h1>Madinah Arabic</h1>
      <p>This native shell loads the hosted Madinah Arabic platform so lessons, vocabulary, progress, accounts, subscriptions, and admin tools stay in sync across web and mobile.</p>
      <a href="http://localhost:4173">Open local app</a>
    </main>
  </body>
</html>
